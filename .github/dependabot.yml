version: 2
# cooldown: 새 버전이 나오고 7일 지난 뒤에 PR을 엶 — 배포 직후 회수·악성 버전을 피함. 보안 업데이트는 기다리지 않음.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "vitest", "@vitejs/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # init·analyze는 같은 버전이어야 함 — 따로 올리면 analyze가 "Loaded a configuration file for version …"로 실패.
      codeql:
        patterns: ["github/codeql-action*"]
