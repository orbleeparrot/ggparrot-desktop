name: test-build

# 시험용 설치 파일 — Actions 탭에서 [Run workflow]로 고른 브랜치를 macOS·Windows 설치 파일로 만들어 내려받게 함.
# 배포가 아님: 릴리스를 만들지 않고, 앱 업데이트 서명·코드 서명도 하지 않음(macOS는 임시 서명).
# 파일 이름은 배포와 같은 규칙(scripts/bundle-names.mjs). 보관 기간 7일.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            build: npx tauri build --target universal-apple-darwin
          - platform: windows-latest
            name: windows
            build: npx tauri build --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 설치 파일 만들기
        run: ${{ matrix.build }}
      - name: 배포와 같은 이름으로
        run: node scripts/name-bundles.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ggparrot-desktop-test-${{ matrix.name }}-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/ggparrot-desktop_*.dmg
            src-tauri/target/release/bundle/nsis/ggparrot-desktop_*-setup.exe
          if-no-files-found: error
          retention-days: 7
