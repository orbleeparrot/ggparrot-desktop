name: release

# main에 들어온 커밋의 CI가 통과하면 자동으로 그 버전(src-tauri/Cargo.toml)의 릴리스 **초안**을 만듦.
#   - macOS·Windows 설치 파일과 앱 업데이트 파일(서명·latest.json)을 초안에 붙임 — 초안에서 바로 내려받아 시험할 수 있음.
#   - 본문은 CHANGELOG에서 자동으로(사용자용 분류만, 지난 배포 태그 뒤의 칸 합침, scripts/release-notes.mjs).
#   - 같은 흐름의 이전 초안은 지우고 새로 만듦(최신 커밋 하나만 초안으로 남음).
#   - 그 버전이 이미 공개됐으면 건너뜀.
# 사용자에게 나가는 것은 Releases에서 초안을 확인하고 [Publish release]를 누를 때 — 그때 태그 v<버전>이 생기고
# 앱의 '업데이트 확인'이 새 버전을 봄(latest 릴리스만 읽음). 배포 여부는 CHANGELOG에 적지 않고 이 태그로 앎.
#
# 필요한 저장소 비밀값
#   TAURI_SIGNING_PRIVATE_KEY           ~/.tauri/ggparrot-desktop-updater.key 내용(앱 업데이트 서명 — 필수)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  위 키의 암호
#   APPLE_* (선택)                      macOS 코드 서명·공증. 넣는 방법은 docs/code-signing.md
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 새 커밋이 오면 진행 중인 초안 만들기를 멈추고 새로 시작함.
concurrency:
  group: release-draft
  cancel-in-progress: true

jobs:
  prepare:
    # main에 푸시한 커밋의 CI가 통과했을 때만(PR CI는 제외). 수동 실행은 main에서만.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      release_id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: 버전 확인 · 이미 공개된 버전이면 건너뜀
        id: check
        run: |
          node scripts/check-versions.mjs
          version="$(node --input-type=module -e "import { readAppInfo } from './scripts/bundle-names.mjs'; process.stdout.write(readAppInfo().version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "v$version" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "false" ]; then
            echo "v$version은 이미 공개됐어요 — 초안을 만들지 않음."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 릴리스 본문(CHANGELOG의 사용자용 내용, 지난 배포 태그 뒤의 칸 합침)
        id: notes
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        # 초안 본문(파일)과 앱 업데이트의 '바뀐 점'(latest.json, build 작업에 넘김)에 같은 내용을 씀.
        # 여러 줄 출력의 끝 표시는 매번 무작위로 — 본문에 같은 줄이 있어도 끊기지 않게.
        run: |
          # 지난 배포는 공개한 릴리스의 태그로 앎 — 얕은 checkout에는 태그가 없어 받아 옴.
          git fetch --tags --force --quiet origin
          node scripts/release-notes.mjs "v$VERSION" > "$RUNNER_TEMP/notes.md"
          eof="GGP_NOTES_$(openssl rand -hex 16)"
          { echo "body<<$eof"; cat "$RUNNER_TEMP/notes.md"; echo "$eof"; } >> "$GITHUB_OUTPUT"
      - name: 이전 초안을 지우고 새 초안 만들기
        id: draft
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft,name \
            --jq '.[] | select(.isDraft and (.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))) | .tagName' |
            while read -r tag; do gh release delete "$tag" --repo "$REPO" --yes; done
          # 만든 응답에서 바로 id를 받음(목록 조회는 막 만든 초안을 늦게 보일 수 있음).
          id="$(gh api -X POST "repos/$REPO/releases" -f tag_name="v$VERSION" -f target_commitish="$SHA" \
            -f name="GGParrot (껄무새) v$VERSION" -F draft=true -F body=@"$RUNNER_TEMP/notes.md" --jq .id)"
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::초안을 만들지 못했어요(id: '$id')."
            exit 1
          fi
          echo "초안 id $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          {
            echo "## 초안 v$VERSION"
            echo
            echo "설치 파일이 붙으면 Releases에서 내려받아 시험하고, 괜찮으면 [Publish release]를 누르세요."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 업데이트 주소를 이 저장소로 맞춘다
        shell: bash
        run: |
          echo "UPDATER_CONFIG={\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"endpoints\":[\"https://github.com/${{ github.repository }}/releases/latest/download/latest.json\"]}}}" >> "$GITHUB_ENV"
      # Apple 비밀값은 값이 있을 때만 환경변수로 넘김.
      # Tauri는 빈 값이라도 변수가 있으면 그 값으로 서명을 시도해 실패함. 없으면 tauri.conf.json의 임시 서명("-")으로 만듦.
      - name: macOS 코드 서명 값(있을 때만)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_if() { if [ -n "${!1}" ]; then { echo "$1<<GGP_ENV_EOF"; printf '%s\n' "${!1}"; echo "GGP_ENV_EOF"; } >> "$GITHUB_ENV"; fi; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do set_if "$v"; done
            if [ -n "$APPLE_ID" ]; then for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do set_if "$v"; done; fi
            echo "macOS: 인증서로 서명$( [ -n "$APPLE_ID" ] && echo '·공증' )"
          else
            echo "macOS: Apple 인증서 없음 — 임시 서명(ad-hoc)으로 만듦"
          fi
      # 초안 id가 없으면 tauri-action이 올리기를 건너뛰고 성공으로 끝남 — 그 전에 멈춤.
      - name: 올릴 초안 확인
        shell: bash
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::올릴 초안 id가 없어요(prepare 작업 확인)."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json의 notes(앱의 '바뀐 점') — releaseId만 넘기면 비어 있음.
          releaseBody: ${{ needs.prepare.outputs.notes }}
          uploadUpdaterJson: true
          # 설치 파일 이름은 기술 이름(scripts/bundle-names.mjs와 같음 — 테스트가 확인)
          releaseAssetNamePattern: "[mainBinaryName]_[version]_[platform]_[arch][setup][ext]"
          args: ${{ matrix.args }} --config ${{ env.UPDATER_CONFIG }}
