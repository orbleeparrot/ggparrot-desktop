name: release-published

# 초안을 [Publish release]로 공개하면 CHANGELOG에 배포 표시를 하고 main에 커밋함(npm run release:mark와 같음).
#   - 공개한 버전 칸에 날짜(한국 시간)를 달고, 함께 나간 칸은 '배포하지 않음(<버전>에 포함)'으로.
#   - 다음 배포의 본문이 여기까지만 합쳐지게 하는 표시.
#   - GITHUB_TOKEN으로 올린 커밋은 다른 워크플로를 깨우지 않음(CI·초안을 다시 만들지 않음).
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-published
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: CHANGELOG 배포 표시
        run: |
          version="${TAG#v}"
          if ! grep -qF "## [$version] - 미배포" CHANGELOG.md; then
            echo "CHANGELOG에 '## [$version] - 미배포' 칸이 없어요 — 이미 표시했거나 칸이 없음. 건너뜀."
            exit 0
          fi
          TZ=Asia/Seoul node scripts/release-notes.mjs "$TAG" --mark
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG 배포 표시"
          git push origin HEAD:main
