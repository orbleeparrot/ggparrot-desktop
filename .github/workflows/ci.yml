name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Versions
        run: npm run check:versions
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 화면 배치 검사(Playwright) — webkit(macOS WKWebView)·chromium(Windows WebView2) 엔진으로 겹침·넘침을 잼.
  # 실패하면 보고서·스크린샷을 산출물로 올림.
  #
  # 느린 것은 시험이 아니라 **내려받기**임. 같은 코드가 7분에 끝나기도 35분에 잘리기도
  # 하고, 잘릴 때는 늘 `npm run test:e2e`를 시작하기도 전에 브라우저·글꼴을 받다가
  # 멈춤. 그래서 받는 양을 줄임 — 크로미움은 headless shell만
  # 받으면 됨(`--only-shell`). 전체 Chrome 186MB는 받아도 쓰지 않음.
  #
  # 잡 이름(`e2e`)은 그대로 둠 — main 브랜치 보호의 필수 검사 이름이라, 매트릭스로
  # 나누면 `e2e (webkit)`처럼 바뀌어 그 검사가 영영 오지 않음.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 한글 글꼴이 없으면 글자가 네모로 그려져 폭이 실제와 달라짐 — Noto CJK를 함께 깖.
      # `--only-shell`은 크로미움에만 뜻이 있어 webkit과 따로 받음. 시스템 의존성은
      # 한 번만 깔면 되므로 `install-deps`로 떼어 둠(`--with-deps`를 두 번 쓰면 apt가 두 번 돎).
      - name: 브라우저·한글 글꼴 설치
        run: |
          npx playwright install-deps webkit chromium
          npx playwright install --only-shell chromium
          npx playwright install webkit
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 화면 배치 검사
        run: npm run test:e2e
      - name: 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # 비밀·취약 의존성 검사 — 어느 하나라도 나오면 실패함.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # 지난 커밋까지 검사
      - name: 비밀 검사(gitleaks · 전체 기록)
        env:
          GITLEAKS_VERSION: 8.30.1
          # 공식 체크섬(gitleaks_8.30.1_checksums.txt) — 받은 파일이 다르면 멈춤. 버전을 올리면 함께 바꿈.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm 취약점(높음 이상)
        run: npm audit --audit-level=high --omit=dev
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      - name: Rust 의존성 취약점(RustSec)
        working-directory: src-tauri
        run: cargo audit
