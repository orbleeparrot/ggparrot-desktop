name: release-prepare

# 배포 준비를 한 번에 — Actions 탭에서 main으로 [Run workflow], 버전(예: 0.18.22)을 넣고 실행.
#   1) 버전이 앱 버전과 같은지·태그가 아직 없는지 확인
#   2) CHANGELOG 배포 표시(npm run release:mark와 같음, 날짜는 한국 시간 오늘)
#   3) 배포 표시를 main에 커밋·푸시하고 v<버전> 태그를 올림
#   4) release 워크플로를 그 태그로 실행 → 설치 파일과 릴리스 초안(본문은 CHANGELOG에서)
# 사용자에게 나가는 것은 Releases에서 초안을 확인하고 [Publish release]를 누를 때.
# 저장소 관리자만 실행할 수 있음. 버전 값은 환경변수로만 스크립트에 넘김(셸 문법이 섞여도 실행되지 않게).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 버전(예: 0.18.22) — src-tauri/Cargo.toml의 버전과 같아야 함"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_INPUT: ${{ inputs.version }}
      ACTOR: ${{ github.actor }}
      REPO: ${{ github.repository }}
    steps:
      - name: 실행한 사람이 저장소 관리자인지 확인
        run: |
          perm="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)"
          if [ "$perm" != "admin" ]; then
            echo "::error::저장소 관리자만 배포를 준비할 수 있어요(지금 권한: $perm)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: 버전 확인
        run: |
          version="${VERSION_INPUT#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 0.18.22처럼 적으세요: $VERSION_INPUT"
            exit 1
          fi
          node scripts/check-versions.mjs "v$version"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version 태그가 이미 있어요. 버전을 올린 뒤 다시 실행하세요."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: CHANGELOG 배포 표시
        run: TZ=Asia/Seoul node scripts/release-notes.mjs "v$VERSION" --mark
      - name: 릴리스 본문 미리 보기(이 실행의 요약에 보임)
        run: |
          {
            echo "## v$VERSION 릴리스 본문"
            echo
            node scripts/release-notes.mjs "v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 커밋·태그 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION 배포 표시"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
      - name: release 워크플로 실행(태그로)
        # GITHUB_TOKEN으로 올린 태그는 push 이벤트로 다른 워크플로를 깨우지 않음 — 그래서 직접 실행함.
        run: gh workflow run release.yml --repo "$REPO" --ref "v$VERSION"
